# Example Nginx reverse-proxy for Bonifaciy API.
# - Exposes HTTPS only
# - Keeps api-server private on localhost:8080
# - Applies basic rate limiting, timeouts and security headers

limit_req_zone $binary_remote_addr zone=bonifaciy_api:10m rate=10r/s;

server {
    listen 80;
    server_name bonifaciy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bonifaciy.example.com;

    ssl_certificate /etc/letsencrypt/live/bonifaciy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bonifaciy.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/bonifaciy.access.log;
    error_log /var/log/nginx/bonifaciy.error.log warn;

    location / {
        limit_req zone=bonifaciy_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
