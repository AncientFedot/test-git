<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bonifaciy 3D V4 Preview</title><style>html,body{margin:0;background:#02040a;color:#dce8f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box}.small{opacity:.68;font-size:13px;margin-top:8px}</style></head><body><div id="load"><div><b>Bonifaciy 3D · V4</b><div class="small" id="status">Загрузка проверенного RELEASE + PATCH snapshot…</div></div></div><script>
(async()=>{
  const base='https://raw.githubusercontent.com/AncientFedot/test-git/f828c8c7e6977b2a14f9f38e432fad422e0dd0cc/bonifaciy-3d-release-patch-v4-20260828/';
  const files=['c0.txt','c1.txt','c2.txt','c3.txt','c4.txt','c5.txt','c6.txt','c7a.txt','c7b.txt'];
  const status=document.getElementById('status');
  const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f,{cache:'no-store'});if(!r.ok)throw new Error(f+': HTTP '+r.status);return r.text()}));
  const b64=parts.join('');
  if(b64.length!==114644) throw new Error('snapshot length mismatch: '+b64.length);
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(b64));
  const hex=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hex!=='2fc564a4b48a744308a3b8a55d111e2ea58517b33f2d7ccd49d8c49cbeb0ce31') throw new Error('snapshot SHA mismatch');
  status.textContent='Snapshot подтверждён. Распаковка…';
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('load').innerHTML='<div><b>Bonifaciy 3D · ошибка загрузки</b><div class="small" style="max-width:680px;word-break:break-word">'+String(e)+'</div></div>';});
</script></body></html>
