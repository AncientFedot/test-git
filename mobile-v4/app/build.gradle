plugins { id 'com.android.application' }

def envOrProp = { String name ->
    def value = System.getenv(name)
    if (value == null || value.trim().isEmpty()) value = project.findProperty(name)
    return value == null ? '' : value.toString()
}

def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'ru.leorix.bonifaciychat'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.leorix.bonifaciychat'
        minSdk 26
        targetSdk 36
        versionCode 21
        versionName '4.0b-native-internal'

        buildConfigField 'String', 'FIREBASE_APP_ID', quoted(envOrProp('BONI_FIREBASE_APP_ID'))
        buildConfigField 'String', 'FIREBASE_API_KEY', quoted(envOrProp('BONI_FIREBASE_API_KEY'))
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', quoted(envOrProp('BONI_FIREBASE_PROJECT_ID'))
        buildConfigField 'String', 'FIREBASE_SENDER_ID', quoted(envOrProp('BONI_FIREBASE_SENDER_ID'))
        buildConfigField 'String', 'RK_BASE_URL', '"https://crm.leorix.ru"'
        buildConfigField 'String', 'BOREY_BASE_URL', '"https://borey.crm.leorix.ru"'
        buildConfigField 'boolean', 'INTERNAL_TEST', 'true'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        bonifaciyTest {
            storeFile file('../bonifaciy-test-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.bonifaciyTest
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-installations'
    implementation 'androidx.work:work-runtime:2.10.2'
    implementation 'androidx.core:core:1.16.0'
}
