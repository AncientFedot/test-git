name: Validate Bonifaciy Chat V4E Native PR

on:
  pull_request:
    branches: [ "bonifaciy-chat-apk-v3-push-test" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BONI_FIREBASE_APP_ID: "1:376053286880:android:74ed820e06563c3d228d85"
      BONI_FIREBASE_API_KEY: "AIzaSyBMSdgXvo6VQjKKdK_1iR8jy0f98cOa9AI"
      BONI_FIREBASE_PROJECT_ID: "bonifaciy-chat"
      BONI_FIREBASE_SENDER_ID: "376053286880"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore persistent Bonifaciy TEST signing identity
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: mobile-src/bonifaciy-test-debug.keystore
          key: bonifaciy-chat-test-debug-signing-v2

      - name: Prepare TEST signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-src mobile-v4
          KEYSTORE="mobile-src/bonifaciy-test-debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: persistent TEST signing key cache is missing"
            exit 11
          fi
          cp "$KEYSTORE" mobile-v4/bonifaciy-test-debug.keystore
          echo "SIGNING_CACHE_HIT=${{ steps.signing-cache.outputs.cache-hit }}"

      - name: Apply accepted V4B UI patch
        run: python mobile-v4/tools/apply_v4b_ui_patch.py

      - name: Apply accepted V4C attachments and remembered-login patch
        run: python mobile-v4/tools/apply_v4c_full_patch.py

      - name: Apply accepted V4C Java lambda fix
        run: python mobile-v4/tools/apply_v4c_java_lambda_fix.py

      - name: Apply accepted V4D attachment URL resolver
        run: python mobile-v4/tools/apply_v4d_attachment_url_patch.py

      - name: Apply V4E event-driven live chat sync
        run: python mobile-v4/tools/apply_v4e_live_chat_sync_patch.py

      - name: Install API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Audit gate - V4E native security and event-driven synchronization
        shell: bash
        run: |
          set -euo pipefail
          MAIN="mobile-v4/app/src/main/java/ru/leorix/bonifaciychat/MainActivity.java"
          SERVICE="mobile-v4/app/src/main/java/ru/leorix/bonifaciychat/BonifaciyMessagingService.java"
          NOTIFY="mobile-v4/app/src/main/java/ru/leorix/bonifaciychat/NotificationHelper.java"
          MANIFEST="mobile-v4/app/src/main/AndroidManifest.xml"
          GRADLE="mobile-v4/app/build.gradle"

          if grep -R -n -E 'android\.webkit\.WebView|<WebView|addJavascriptInterface|WebViewClient|WebChromeClient' mobile-v4/app/src; then
            echo "ERROR: WebView surface detected"
            exit 21
          fi
          if grep -R -n -E 'DIRECTORY_DOWNLOADS|setDestinationInExternal|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE' mobile-v4/app/src; then
            echo "ERROR: public/external attachment storage detected"
            exit 22
          fi

          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'targetSdk 36' "$GRADLE"
          grep -q 'versionCode 24' "$GRADLE"
          grep -q "versionName '4.0e-native-internal'" "$GRADLE"
          grep -q 'debuggable false' "$GRADLE"

          grep -q 'V4Core.SecureStore.put(this, "remember_password_"' "$MAIN"
          grep -q 'nativeAttachmentPathFromWebUrl' "$MAIN"
          grep -q 'FileProvider.getUriForFile' "$MAIN"

          grep -q 'static void onChatPushReceived' "$MAIN"
          grep -q 'handleForegroundChatPush' "$MAIN"
          grep -q 'syncOpenChatIncremental' "$MAIN"
          grep -q '&after_id=' "$MAIN"
          grep -q 'protected void onResume()' "$MAIN"
          grep -q 'appendMessages' "$MAIN"
          grep -q 'Новые сообщения (' "$MAIN"
          grep -q 'push_chat_title' "$MAIN"
          grep -q 'push_chat_title' "$NOTIFY"
          grep -q 'MainActivity.onChatPushReceived' "$SERVICE"

          if grep -q 'postDelayed' "$MAIN"; then
            echo "ERROR: periodic polling loop detected; V4E must remain event-driven"
            exit 23
          fi

          echo "V4E_NATIVE_ONLY_GATE=OK"
          echo "V4E_EVENT_DRIVEN_PUSH_SYNC_GATE=OK"
          echo "V4E_RESUME_SYNC_GATE=OK"
          echo "V4E_INCREMENTAL_AFTER_ID_GATE=OK"
          echo "V4E_NO_PERIODIC_POLLING_GATE=OK"
          echo "V4E_SCROLL_PRESERVATION_GATE=OK"
          echo "V4E_REAL_CHAT_TITLE_GATE=OK"
          echo "V4E_V4D_ATTACHMENT_GATE=OK"
          echo "V4E_ENCRYPTED_REMEMBERED_LOGIN_GATE=OK"
          echo "V4E_PRIVATE_STORAGE_GATE=OK"
          echo "V4E_API36_GATE=OK"

      - name: Build V4E debug APK
        working-directory: mobile-v4
        run: gradle assembleDebug --stacktrace

      - name: Verify V4E APK signature is compatible with V4B/V4C/V4D
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile-v4/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/v4e-sign.txt
          DIGEST="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/v4e-sign.txt | sed -n '1p')"
          test -n "$DIGEST"
          DIGEST="${DIGEST^^}"
          printf 'CERT_SHA256=%s\n' "$DIGEST" > V4E_SIGNING_SHA256.txt
          test "$DIGEST" = "7294CCBBFDEEAF090F17F4FCC4E0A480A78DF344D166CACF52D87D0EBE4A8203"
          cat V4E_SIGNING_SHA256.txt

      - name: Package V4E artifact
        shell: bash
        run: |
          set -euo pipefail
          cp mobile-v4/app/build/outputs/apk/debug/app-debug.apk BonifaciyChat-V4E-NATIVE-LIVE-SYNC-INTERNAL-TEST.apk
          sha256sum BonifaciyChat-V4E-NATIVE-LIVE-SYNC-INTERNAL-TEST.apk | tee V4E_APK_SHA256.txt
          cat > V4E_SECURITY_GATE.txt <<'EOF'
          STATUS=INTERNAL_TEST_ONLY
          WEBVIEW=ABSENT_BY_CI_GATE
          PUBLIC_DOWNLOADS=ABSENT_BY_CI_GATE
          ALLOW_BACKUP=FALSE
          CLEAR_TEXT=FALSE
          TARGET_SDK=36
          REMEMBERED_LOGIN=ANDROID_KEYSTORE_AES_GCM
          V4D_ATTACHMENT_WEB_URL_RESOLVER=TRUE
          LIVE_CHAT_SYNC=EVENT_DRIVEN_FCM_PLUS_ON_RESUME
          PERIODIC_POLLING=FALSE
          INCREMENTAL_AFTER_ID=TRUE
          SCROLL_POSITION_PRESERVED=TRUE
          NEW_MESSAGE_INDICATOR=TRUE
          PUSH_REAL_CHAT_TITLE=TRUE
          V4B_V4C_V4D_SIGNING_COMPATIBLE=TRUE
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: BonifaciyChat-V4E-NATIVE-LIVE-SYNC-INTERNAL-TEST
          path: |
            BonifaciyChat-V4E-NATIVE-LIVE-SYNC-INTERNAL-TEST.apk
            V4E_APK_SHA256.txt
            V4E_SIGNING_SHA256.txt
            V4E_SECURITY_GATE.txt
