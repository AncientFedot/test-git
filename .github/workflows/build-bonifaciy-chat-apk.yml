name: Build Bonifaciy Chat APK

on:
  push:
    branches: [ "bonifaciy-chat-apk-build-v1", "bonifaciy-chat-apk-v2-test", "bonifaciy-chat-apk-v3-push-test" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BONI_FIREBASE_APP_ID: "1:376053286880:android:74ed820e06563c3d228d85"
      BONI_FIREBASE_API_KEY: "AIzaSyBMSdgXvo6VQjKKdK_1iR8jy0f98cOa9AI"
      BONI_FIREBASE_PROJECT_ID: "bonifaciy-chat"
      BONI_FIREBASE_SENDER_ID: "376053286880"
    steps:
      - uses: actions/checkout@v4

      - name: Publish V3C run locator
        if: github.ref == 'refs/heads/bonifaciy-chat-apk-v3-push-test'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "HEAD_SHA=${GITHUB_SHA}"
            echo "STATE=STARTED"
          } > mobile-src/V3C_RUN_LOCATOR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-src/V3C_RUN_LOCATOR.txt
          if ! git diff --cached --quiet; then
            git commit -m "V3C run locator [skip ci]"
            git push origin HEAD:bonifaciy-chat-apk-v3-push-test
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent TEST signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bonifaciy-chat-v3c-test-signing-v1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Apply V3C source patch
        working-directory: mobile-src
        run: python patch_v3_source.py
      - name: Build debug APK
        working-directory: mobile-src
        run: gradle assembleDebug

      - name: Record TEST signing certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | awk '/SHA256:/{print "CERT_SHA256=" $2; exit}' \
            | tee V3C_SIGNING_SHA256.txt
          test -s V3C_SIGNING_SHA256.txt

      - name: Rename APK
        run: cp mobile-src/app/build/outputs/apk/debug/app-debug.apk BonifaciyChat-V3C-PUSH-DIAG-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BonifaciyChat-V3C-PUSH-DIAG-TEST
          path: |
            BonifaciyChat-V3C-PUSH-DIAG-TEST.apk
            V3C_SIGNING_SHA256.txt

      - name: Publish non-secret build metadata
        if: github.ref == 'refs/heads/bonifaciy-chat-apk-v3-push-test'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "HEAD_SHA=${GITHUB_SHA}"
            echo "STATE=SUCCESS"
            cat V3C_SIGNING_SHA256.txt
          } > mobile-src/V3C_BUILD_META.txt
          git add mobile-src/V3C_BUILD_META.txt mobile-src/V3C_RUN_LOCATOR.txt
          git commit -m "V3C build metadata [skip ci]"
          git push origin HEAD:bonifaciy-chat-apk-v3-push-test
