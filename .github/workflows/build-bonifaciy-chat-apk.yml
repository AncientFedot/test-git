name: Build Bonifaciy Chat APK

on:
  push:
    branches: [ "bonifaciy-chat-apk-build-v1" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack Android project
        run: |
          rm -rf mobile-build
          mkdir mobile-build
          unzip -q mobile/BONIFACIY_CHAT_ANDROID_V1_TEST_SOURCE.zip -d mobile-build
      - name: Build debug APK
        working-directory: mobile-build/BonifaciyChat_Android_V1
        run: gradle assembleDebug
      - name: Rename APK
        run: cp mobile-build/BonifaciyChat_Android_V1/app/build/outputs/apk/debug/app-debug.apk BonifaciyChat-V1-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BonifaciyChat-V1-TEST
          path: BonifaciyChat-V1-TEST.apk
