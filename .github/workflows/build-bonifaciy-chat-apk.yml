name: Build Bonifaciy Chat APK

on:
  push:
    branches: [ "bonifaciy-chat-apk-build-v1", "bonifaciy-chat-apk-v2-test" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: mobile-src
        run: gradle assembleDebug
      - name: Rename APK
        run: cp mobile-src/app/build/outputs/apk/debug/app-debug.apk BonifaciyChat-V2-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BonifaciyChat-V2-TEST
          path: BonifaciyChat-V2-TEST.apk
