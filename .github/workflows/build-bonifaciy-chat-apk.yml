name: Build Bonifaciy Chat APK

on:
  push:
    branches: [ "bonifaciy-chat-apk-build-v1", "bonifaciy-chat-apk-v2-test", "bonifaciy-chat-apk-v3-push-test" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Firebase Android client identifiers are public app configuration, not
    # Firebase Admin/server credentials. Never place a service-account key here.
    env:
      BONI_FIREBASE_APP_ID: "1:376053286880:android:74ed820e06563c3d228d85"
      BONI_FIREBASE_API_KEY: "AIzaSyBMSdgXvo6VQjKKdK_1iR8jy0f98cOa9AI"
      BONI_FIREBASE_PROJECT_ID: "bonifaciy-chat"
      BONI_FIREBASE_SENDER_ID: "376053286880"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: mobile-src
        run: gradle assembleDebug
      - name: Rename APK
        run: cp mobile-src/app/build/outputs/apk/debug/app-debug.apk BonifaciyChat-V3-PUSH-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BonifaciyChat-V3-PUSH-TEST
          path: BonifaciyChat-V3-PUSH-TEST.apk
